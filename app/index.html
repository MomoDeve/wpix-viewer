<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WPix Viewer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>WPix Viewer <span>PIX GPU Capture Analyzer</span></h1>
        </header>

        <section id="upload-section">
            <div id="drop-zone">
                <div class="icon">&#128190;</div>
                <strong>Drop .wpix file here</strong>
                <p>or click to browse</p>
            </div>
            <input type="file" id="file-input" accept=".wpix">
        </section>

        <div id="status"></div>

        <section id="results-section">
            <div class="panel">
                <h2>Capture Info</h2>
                <div id="capture-info"></div>
            </div>

            <div class="panel">
                <h2>Block Map</h2>
                <div id="block-map"></div>
            </div>

            <div class="panel">
                <h2>WPIX Resources</h2>
                <div id="resource-table"></div>
            </div>

            <div class="panel">
                <h2>Events</h2>
                <div id="event-table"></div>
            </div>
        </section>
    </div>

    <script src="js/xpress.js"></script>
    <script src="js/parser.js"></script>
    <script src="js/event-decoder.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
